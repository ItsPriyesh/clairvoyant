<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css?family=Rajdhani:600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="dash.css">

    <title>Clairvoyant</title>
  </head>
  <body>

    <!-- Header with Clairovant logo -->
    <!-- Map Section: Show dot for each node in the mesh, hover shows last event  -->
    <!-- History section: show last 5 datapoints events (expandable) -->

    <nav class="header navbar navbar-expand-sm">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="logo" href="#">CLAIRVOYANT</a>
        </li>
      </ul>
    </nav>

    <div class="container">
      <div class="row" style="padding-bottom: 24px; padding-top: 32px">
        <div class="col-md-8">
          <div class="card">
            <p class="subheading">Mesh Network</p>
            <div id="network-container"></div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card" style="height: 265px">
            <p class="subheading">Recent Activity</p>
            <div id="datapoint-notif" class="animate-idle">
              <p id="notif-node" class="roboto-bold"></p>
              <p id="notif-class" class="roboto-med">No recent events</p>
              <p id="notif-time-ago" class="roboto-reg"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-5">
          <div class="card">
            <p class="subheading">Event Breakdown</p>
            <canvas id="event-pie" style="margin: 10px"></canvas>
          </div>
        </div>
        <div class="col-md-7">
          <div class="card">
            <p class="subheading">History</p>
            <table id="history_table" style="margin-left: 8px">
              <thead>
                <tr>
                  <th class="history_table_head">Source</th>
                  <th class="history_table_head">Type</th>
                  <th class="history_table_head">Confidence</th>
                  <th class="history_table_head">Time</th>
                </tr>
              </thead>
              <tbody class="history_table_body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/ui/1.10.4/jquery-ui.min.js" integrity="sha256-oTyWrNiP6Qftu4vs2g0RPCKr3g1a6QTlITNgoebxRc4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.bundle.js"></script>
    <script src="sigma.min.js"></script>
    <script src="dash.js" type="text/javascript"></script>
  </body>
</html>
