apiVersion: v1
kind: Service
metadata:
  name: clairvoyant-extension
spec:
  selector:
    app: clairvoyant-extension
  ports:
  - port: 5000
  type: NodePort
---
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: clairvoyant-extension
  labels:
    app: clairvoyant-extension
spec:
  selector:
    matchLabels:
      app: clairvoyant-extension
  replicas: 1
  template:
    metadata:
      labels:
        app: clairvoyant-extension
    spec:
      containers:
      - name: clairvoyant-extension
        image: codait/max-audio-classifier:latest
        ports:
        - containerPort: 5000
