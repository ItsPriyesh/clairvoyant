syntax = "proto3";

option java_multiple_files = true;

package io.clairvoyant.proto;

service ClairvoyantService {
    rpc CreateDataPoint (DataPoint) returns (Ack) {}
    rpc Ping (Heartbeat) returns (Ack) {}
}

message DataPoint {
    int32 id = 1;
    int32 node_id = 2;
    int64 timestamp = 3;
    string event_type = 4;
    float confidence = 5;
}

message Heartbeat {
    int32 id = 1;
    int64 timestamp = 2;
    float battery_level = 3;
}

message Ack {
    int32 data_point_id = 1;
}