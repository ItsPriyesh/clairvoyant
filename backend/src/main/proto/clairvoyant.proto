syntax = "proto3";

option java_multiple_files = true;

package io.clairvoyant.proto;

service ClairvoyantService {
    rpc CreateDataPoint (DataPoint) returns (Ack) {}
    rpc Ping (Heartbeat) returns (Ack) {}
}

message DataPoint {
    string node_id = 1;
    string message_id = 2;
    int64 timestamp = 3;
    string classification = 4;
    float confidence = 5;
    int32 retry_count = 6;
    int32 hop_count = 7;
}

message Heartbeat {
    string node_id = 1;
    string message_id = 2;
    int64 timestamp = 3;
    float battery_level = 4;
    int32 retry_count = 5;
    int32 hop_count = 6;
}

message Ack {
    string node_id = 1;
    string message_id = 2;
}
